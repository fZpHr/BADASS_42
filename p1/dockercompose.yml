services:
  busybox:
    image: busybox
    container_name: host_hbelle
    networks:
      - badass

  frr:
    build:
      context: ./frrouting
      dockerfile: Dockerfile
    container_name: routeur_hbelle
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    privileged: true
    ports:
      - "179:179"
      - "2601:2601"
      - "2604-2610:2604-2610"
    networks:
      - badass

networks:
  badass:
    driver: bridge